# msg 后端工作区根（uv workspace）：虚拟工程，只承载工作区成员与共享工具配置。
# 成员：services/*（各服务工程，独立 pyproject / 独立构建）。
# 共享基座：跨仓路径依赖 `bms-core` 与 `engkit`（与 mdm 同构，本地改基座即时生效）。

[tool.uv.workspace]
members = ["services/*"]

[tool.uv]
constraint-dependencies = ["sqlalchemy>=2.0,<2.1"]

[tool.uv.sources]
bms-core = { path = "../../bms/backend/libs/bms_core", editable = true }
engkit = { path = "../../engkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    # 部署编排（deploy/compose/msg.yml）结构校验：用例需解析 YAML 后断言端口 / 网络 / 卷 / 停机
    "pyyaml>=6.0",
    "engkit[devtools]",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
extend = "../../engkit/toolchain/ruff-base.toml"
target-version = "py314"

[tool.ruff.lint.isort]
known-first-party = [
    "bms_msg",
    "services",
    "ops",
    "tests_support",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["services"]
ignore = ["alembic"]
extraPaths = ["services/msg/src", "."]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -p engkit.coverage_plugin"
testpaths = [
    "services/msg/tests",
    "tests",
]
pythonpath = [
    ".",
    "services/msg/src",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
    "own_db: 用例自建库 / 自持库状态（单库化白名单，04-6-2）",
]
