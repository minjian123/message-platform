# dev 环境覆盖（可读日志 + 本地 SQLite 每服务库 + 放行本地前端开发服务器）

[app]
debug = true

[log]
level = "DEBUG"
format = "console"
slow_request_ms = 500

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[database]
sqlite_dir = "../../database/msg"
auto_create = true

[database.platform]
url = "sqlite+aiosqlite:///./msg_platform.db"
url_template = "sqlite+aiosqlite:///./msg_{service}.db"

[database.tenants]
url = "sqlite+aiosqlite:///./msg_tenant_demo.db"
url_template = "sqlite+aiosqlite:///./msg_{service}_{tenant}.db"

[database.archive]
url = "sqlite+aiosqlite:///./msg_archive.db"

[tenant]
dev_tenants = ["demo"]
# 开发态显式租户（租户编码）：无令牌入口（数据面直连 / h2 调试）本地使用；生产配置**不得出现**
# （基座启动校验非空即拒启）。留空 = 不启用，数据面仍只认令牌租户位。
dev_override_tenant = ""

# 健康检查注册表：msg 自持实现（02-6）。基座缺省 provider 为空 → NullHealthCheckRegistry（空检查项），
# 即 /readyz 只判「启动完成 + 未摘流」；切到 msg 后由 msg_storage（必需：目录可写 + 水位）、
# msg_recovery（非必需）与 database（必需）三项聚合。不能用基座 local：它无条件登记 redis 检查项。
[health_check_registry]
provider = "msg"
