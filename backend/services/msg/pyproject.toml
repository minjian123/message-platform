[project]
name = "bms-msg"
version = "0.1.0"
description = "msg 消息平台服务"
requires-python = ">=3.14"
dependencies = [
    "bms-core",
    "fastapi>=0.115",
    "msgpack>=1.1",
    # RPC 客户端（04-1）走 HTTP/2，需要 `h2` 传输实现；只在 dev 组装会让生产镜像缺依赖。
    "httpx[http2]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_msg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -p engkit.coverage_plugin"
testpaths = ["tests"]
pythonpath = [
    "../..",
    "src",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
    "own_db: 用例自建库 / 自持库状态（单库化白名单，04-6-2）",
]
