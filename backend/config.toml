# msg 后端配置（基线；三环境差异见 config.dev.toml / config.test.toml / config.prod.toml）
# 环境由 BMS_ENV 指定（缺省 dev）；环境变量（BMS_ 前缀）优先级最高。
# 最小差异口径：本文件只写 msg 特有项，其余走基座 Settings 默认值。

[app]
name = "msg 消息平台"
env = "dev"
debug = false
worker_id = 0
# 服务标识（空则取服务包声明 `bms_msg.SERVICE_NAME` = msg）
service = ""
docs_enabled = true
# 服务包名前缀：链的服务模型模块按 {package_prefix}_{service}.models 解析
# 本仓服务包名是 bms_msg（前缀 bms + 服务 msg）→ 前缀必须配 bms；配 msg 会解析出 msg.models
# （同名去重）而取到空模型清单，迁移链与开发库自动建表都建不出表（2026-11-04 修正）
package_prefix = "bms"

[server]
host = "0.0.0.0"
port = 8000
workers = 1

[database]
# 库名前缀：平台库 {prefix}_{service} / 服务租户库 {prefix}_{service}_{tenant} / 归档库 {prefix}_archive
# prefix == service 时基座去重 → msg / msg_{tenant} / msg_archive
name_prefix = "msg"

[tenant]
resolve_cache_ttl = 60

[tenant_guard]
# 租户可用性守卫（bms 任务 04_02）：msg 继承默认实现补命名空间校验，经 configure_plugins 登记为 msg
provider = "msg"

[error_mapper]
# 产品码覆盖（bms 能力域 error_mapper）：统一错误响应单点把基座租户判定码改写成 msg 段位码
# 80002（停用）→ 350011、80001（不存在）→ 350012；空串表示不覆盖（出基座码）
provider = "msg"

# 健康检查注册表：msg 自持实现（02-6）。基座缺省 provider 为空 → NullHealthCheckRegistry（空检查项），
# 即 /readyz 只判「启动完成 + 未摘流」；切到 msg 后由 msg_storage（必需：目录可写 + 水位）、
# msg_recovery（非必需）与 database（必需）三项聚合。不能用基座 local：它无条件登记 redis 检查项。
[health_check_registry]
provider = "msg"

[cache]
provider = "memory"
options = {}

[service_client]
provider = "http"
options = { attach_service_token = true }

[service_token]
provider = "jwt"
issuer = "bms"
ttl_seconds = 300
active_kid = ""

[service_token.keys]

[token_verifier]
provider = "unified"

[outbox_store]
# 事务性发件箱（审计链的写入载体）：不配则落 NullOutboxStore —— 审计事件被**静默丢弃**（01-6 实测现状）
provider = "sql"
options = {}

[audit_log]
# 操作审计中间件（bms 06_01）：写方法全记；这里显式排除数据面高频路径与重放端点。
# - 排除数据面：需求 05-6「普通读写不逐条留痕」，publish / consume / ack / 成员心跳逐条写会洪泛；
# - 排除 /msg/admin/replay：重放由 msg 自身写「创建 + 终态」两条结果级审计（含范围与首末 log_id），
#   中间件那条只有请求体，留着就是同一操作两条留痕；
# - 本键是**整表覆盖**，默认 4 条认证排除路径必须一并写回（少写即丢默认值）。
enabled = true
exclude_paths = [
  "/api/v1/auth/login",
  "/api/v1/auth/refresh",
  "/api/v1/auth/logout",
  "/api/v1/auth/introspect",
  "/api/v1/msg/publish",
  "/api/v1/msg/consume",
  "/api/v1/msg/ack",
  "/api/v1/msg/join",
  "/api/v1/msg/heartbeat",
  "/api/v1/msg/leave",
  "/api/v1/msg/admin/replay",
]
