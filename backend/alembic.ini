# Alembic 迁移配置（按「业务域 × 数据源」分清单：清单名 = 配置段名）
#
# 用法（清单名经 `-n` 指定）：
#   uv run alembic -n alembic:msg:platform upgrade head   # 消息平台域 × 平台服务库
#
# 段名规则：配置段名 = `[alembic:{domain}:{datasource}]`；缺省 `[alembic]` 段供裸命令使用，
# 指向与缺省清单**同一版本目录**（避免两段漂移）。业务域是架构边界，服务标识只用于库键。
# 口径同《数据库开发规范》「迁移与建表口径」：新增业务域首次迁移时补段。
#
# 扩展参数（`-x`）：
#   -x url=<连接串>            显式覆盖连接串（优先于环境变量与配置）
#   -x db_key=tenant_msg_demo  按库键经 url_template 解析连接串（运维通道，可跨服务）
#   -x schema=<模式名>         达梦模式切换（仅达梦方言生效）
#
# URL 一律不在此硬编码（由 alembic/env.py 经配置基座 / 环境变量读取）；
# 版本目录按清单声明在各自配置段的 `version_locations`（Alembic 在 env.py 之前读取，故必须在 ini）。
# 清单定义与表集派生见 `bms_core/db/migration.py`。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# 路径分隔口径（新式：os.pathsep；避免 Alembic 旧式空格 / 逗号 / 冒号切分的弃用告警）
path_separator = os
# 版本目录（缺省清单 msg:platform：消息平台域 × 平台服务库）
version_locations = %(here)s/alembic/versions/msg/platform
# 迁移文件命名：「序号_描述」（revision id 清单内独立递增）
file_template = %%(rev)s_%%(slug)s

# 消息平台域（业务域 `msg`，承载服务 `msg`）× 平台服务库：首批表（topic / partition / consumer_group /
# offset 等）落脚本后在此目录追加；8B_00 阶段为空链，执行时打印「无脚本（跳过）」。
[alembic:msg:platform]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/msg/platform
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
