# msg 产品自持声明（平台装载 + 装载期校验）
#
# 七段并列：产品档案 / 服务行 / 产品级路由 / 数据源 / 能力 / 种子 / 错误码。
# 口径：基座 `bms_core.registry.products`（同源、同装载入口、同视图族、同唯一性纪律）。
# 校验：`ops.check_modules` 与平台装配期复用同一实现；任一不满足即拒启。
#
# 8B_00 阶段：登记产品档案、服务行与产品路由；数据源 / 能力 / 种子随实现补。
# 8B_01_1 起登记错误码（段位取自本文件服务行 `errcode_segment = "35"`，6 位码 = 2 位段 + 4 位序号）。
# `errcode_segment = "35"` 为暂定值，最终以 07C 标识符登记为准（登记后仅段位调整，码位不变）。

product_key = "msg"

[[products]]
product_key = "msg"
name = "消息平台"
frontend_package_source = "msg#frontend"
status = "enabled"

[[services]]
module_key = "msg"
service_key = "msg"
name = "msg 消息平台服务"
table_prefix = "msg_"
business_code = "msg"
errcode_segment = "35"
event_domain = "msg"
service_group = "product"
build_batch = 3
service_version = "0.1.0"
contract_version = "0.1.0"
tenant_base = true
product_key = "msg"
status = "enabled"

[[product_routes]]
product_key = "msg"
domain = "msg"
service_key = "msg"
description = "msg 消息平台服务（对外 /api/msg/v1/msg/...）"

# ---- 数据源（第五段之前的产品数据源登记）----
# 租户用量只读投影：bms 租户管理页按 `data_source_key` 装载只读板块，
# 前端经网关直取 `path`（对应内部 `/api/v1/msg/tenant-usage`）。
# 口径：配额单一事实源在 msg（`msg_quota`），bms 侧只读、不双写（见架构设计 07 篇第 6 节）。
[[data_sources]]
data_source_key = "msg_tenant_usage"
name = "消息平台用量"
kind = "form"
data_source = "msg.msg.tenant_usage"
origin = "product"
product_key = "msg"
path = "/tenant-usage"
allowlist = ["topic_count", "partition_count", "storage_bytes", "delivered_today"]
status = "enabled"

# ---- 配额只读投影（07D 任务 03 附录 C；与上面的 form 声明并存，不互相取代）----
# 单一事实源在 msg 侧；平台经配额投影读取器实时只读取数，不双写、不落库。
# path 为内部公开契约完整路径（从 /api/v1 起），端点由 msg 最小实现返回 {items: []}。
# quota_unit 为声明级单值，四维度单位不统一属 02-3 契约现状，见实施记录「偏差与遗留」。
[[data_sources]]
data_source_key = "msg_quota_projection"
name = "消息平台配额投影"
kind = "quota"
data_source = "msg.msg.quota_projection"
origin = "product"
product_key = "msg"
path = "/api/v1/msg/tenant-usage/quota"
quota_dimensions = ["topic_count", "storage_bytes", "throughput", "connections"]
quota_unit = "count"
quota_period = "none"
status = "enabled"

# ---- 种子（第六类记录；平台统一编排，一个 XA 全局事务内执行）----
# 写平台服务库（sys_business / sys_form / sys_field）；不建菜单关联（sys_menu_form）、
# 不建按钮 / 权限码。入口在平台编排的 XA 分支内只 flush、不自行 commit。
# 种子名须以产品键 `msg-` 开头（平台装载期校验）；module 取服务包 `bms_msg`，不是顶层 `msg`。
[[seeds]]
name = "msg-usage-forms"
service = "msg"
db_key = "platform_platform"
module = "bms_msg.seeds.forms"
entry = "seed_usage_forms"
after = []
description = "消息平台用量表单与字段（业务码 msg_usage + 表单 + 四字段）"
status = "enabled"

[seeds.tables]
sys_business = "code"
sys_form = "business_id"
sys_field = "form_id,field_key"

# ---- 错误码（第七类记录；段位取自本文件服务行 errcode_segment = "35"）----
# 6 位码 = 2 位段 + 4 位序号；与 `backend/services/msg/src/bms_msg/errors.py` 的 `MsgErrorCode`
# 及异常类 `http_status_` 逐条对齐（对账断言见 `backend/services/msg/tests/test_error_codes.py`）。
# 文案键格式 `<product>.error.<snake>`；判定顺序：租户（350012 / 350011）→ 命名空间（350010）→ 主题。
[[errcodes]]
code = 350010
domain = "msg"
http_status = 400
message_key = "msg.error.namespace_invalid"
severity = "warning"
description = "命名空间未登记或未启用（须为服务目录中已启用的 module_key）"

[[errcodes]]
code = 350011
domain = "msg"
http_status = 403
message_key = "msg.error.tenant_suspended"
severity = "warning"
description = "租户已停用（拒绝生产与消费，数据保留）"
# 声明式映射：基座停用码 80002 → 350011（403 → 403）；统一渲染单点声明优先
maps_from = [80002]

[[errcodes]]
code = 350012
domain = "msg"
http_status = 404
message_key = "msg.error.tenant_not_found"
severity = "warning"
description = "租户不存在（不泄露租户是否存在）"
# 声明式映射：基座租户不存在码 80001 → 350012（404 → 404）
maps_from = [80001]

# ---- 主题与分区（任务 01-1；判定顺序：租户 → 命名空间 → 主题）----
[[errcodes]]
code = 350001
domain = "msg"
http_status = 404
message_key = "msg.error.topic_not_found"
severity = "warning"
description = "主题不存在（不属于当前租户，或未处于 active）"

[[errcodes]]
code = 350008
domain = "msg"
http_status = 409
message_key = "msg.error.topic_exists"
severity = "warning"
description = "主题已存在（同租户 / 命名空间 / 名称）"

[[errcodes]]
code = 350009
domain = "msg"
http_status = 400
message_key = "msg.error.partition_count_invalid"
severity = "warning"
description = "分区数 / 分区号非法（≤0、超上限、尝试减少，或分区号越界）；保留期越界同码"

# ---- 投递语义（任务 01-2；判定顺序：租户 → 命名空间 → 主题 → 分区号 → 位点 / 消息）----
# 350004 / 350005 / 350006 由架构 05 §5 预留（超时 / 背压 / 消息过大），本任务未占用（350006 已由 03-2 启用，见文末协议层段）。
[[errcodes]]
code = 350002
domain = "msg"
http_status = 400
message_key = "msg.error.offset_invalid"
severity = "warning"
description = "位点非法（提交值 ≥ LEO 或越过分区范围）"

[[errcodes]]
code = 350003
domain = "msg"
http_status = 404
message_key = "msg.error.message_not_found"
severity = "warning"
description = "消息不存在（未投递过，或位点已被保留期清理）"

[[errcodes]]
code = 350007
domain = "msg"
http_status = 409
message_key = "msg.error.delivery_exhausted"
severity = "warning"
description = "消息重投超限、已转入死信（不可再确认）"

# ---- 消费组（任务 01-4；判定顺序：租户 → 命名空间 → 主题 → 组 → 分区号 → 成员与归属）----
# 350004 / 350005 / 350006 仍为架构 05 §5 预留（超时 / 背压 / 消息过大），本任务未占用（350006 已由 03-2 启用，见文末协议层段）。
[[errcodes]]
code = 350013
domain = "msg"
http_status = 404
message_key = "msg.error.group_not_found"
severity = "warning"
description = "消费组不存在（未加入过，或已被回收 / 删除）"

[[errcodes]]
code = 350014
domain = "msg"
http_status = 409
message_key = "msg.error.member_invalid"
severity = "warning"
description = "成员非法（不在组内、已超时失效或已离开），或所请求分区不在其分配内"

# ---- 延迟消息（任务 01-5；判定顺序：命名空间 → 主题 → 分区 → 档位 → 延迟区容量）----
# 350004 / 350005 / 350006 仍为架构 05 §5 预留（超时 / 背压 / 消息过大），本任务未占用（350006 已由 03-2 启用，见文末协议层段）。
# 350015 与 350005 分工：前者「延迟区堆住了」，后者「整体过载」——排障时一眼分清。
[[errcodes]]
code = 350015
domain = "msg"
http_status = 429
message_key = "msg.error.delay_quota_exceeded"
severity = "warning"
description = "延迟区已满（每租户软上限到顶）；只拒绝进、不静默清，超限记录仍可查"

# ---- 消息保留与重放（任务 01-6；判定顺序：租户 → 命名空间 → 主题 → 分区 → 任务状态）----
# 350004 / 350005 仍为架构 05 §5 预留（超时 / 背压）；350006 由 03-2 启用（帧或消息体超 1 MiB）；
# 350018 / 350019 由 03-2 占用（帧格式非法 / 协议版本不支持）；350020 起留给 06 域（死信处置 / 管理台写操作）。
[[errcodes]]
code = 350016
domain = "msg"
http_status = 404
message_key = "msg.error.replay_task_not_found"
severity = "warning"
description = "重放任务不存在（不属于当前租户，或已被清理）"

[[errcodes]]
code = 350017
domain = "msg"
http_status = 409
message_key = "msg.error.replay_task_invalid_state"
severity = "warning"
description = "重放任务状态不允许该操作（终态不可逆；恢复只接受已暂停的任务）"

# ---- 协议层（任务 03-2：帧编解码与版本演进）----
# 350018 / 350019 主要经帧路径返回（error 帧，HTTP 200）；JSON 路径下 350018 不出现在业务端点。
[[errcodes]]
code = 350006
domain = "msg"
http_status = 413
message_key = "msg.error.payload_too_large"
severity = "warning"
description = "帧或消息体超过上限（header 64 KiB / payload 1 MiB），先判长度再读内容"

[[errcodes]]
code = 350018
domain = "msg"
http_status = 400
message_key = "msg.error.frame_invalid"
severity = "warning"
description = "帧格式非法（长度不足 / 多余字节 / header 非 Map / 缺必填头 / 类型与路径不匹配）"

[[errcodes]]
code = 350019
domain = "msg"
http_status = 400
message_key = "msg.error.version_unsupported"
severity = "warning"
description = "协议主版本不支持（服务端只认同一主版本；返回后结束该 stream，由客户端断开连接）"

[[errcodes]]
code = 350020
domain = "msg"
http_status = 429
message_key = "msg.error.connection_limit_exceeded"
severity = "warning"
description = "连接数超限（单副本有效连接数已达上限；客户端应换实例或退避重连）"

[[errcodes]]
code = 350021
domain = "msg"
http_status = 429
message_key = "msg.error.stream_limit_exceeded"
severity = "warning"
description = "单连接长驻流超限（已达单连接长驻流上限；客户端应降并发或另开连接）"

# ---- 背压与流控（任务 03-5：生产限流）----
# 350005 与相邻码分工：350015 延迟区满（容量）、350020 连接数满、350021 单连接流满、350006 消息过大；
# 本码只表示「生产速率超出配额」，JSON 形态回 429 + Retry-After，帧形态回 error 帧 + retry_after_ms。
# 消费侧 inflight 暂停不是错误（返空批 + paused 字段），因此不占任何码位。
[[errcodes]]
code = 350005
domain = "msg"
http_status = 429
message_key = "msg.error.rate_limited"
severity = "warning"
description = "生产限流（租户 / 主题速率超出配额）；客户端应按 Retry-After 或 retry_after_ms 退避"

# 存储水位拒绝（02-6）：与 350005 限流、350015 延迟区满分立——盘满必须停止发布并介入清理，
# 退避重试无用；故取 507（Insufficient Storage）而不是 429 / 503。
# 帧形态按系统层返回（layer=system、retryable=true：清理后即可恢复）。
[[errcodes]]
code = 350022
domain = "msg"
http_status = 507
message_key = "msg.error.storage_watermark_exceeded"
severity = "error"
description = "存储水位拒绝（卷使用率超拒绝阈值，或消息数据卷不可用）；须清理过期段或扩容后重试"

# ---- RPC（任务 04-1 / 04-2 / 04-3-1）----
# 四个码分工：350023 方法未注册（改参无用，应查对端能力）、350004 预算耗尽（超时=结果未知，
# 不得直接重试）、350024 流空闲超时（这条流没进展，应重开流而不是原地重试）、
# 10001 方法名形态非法（契约层 / 改参可解）。
[[errcodes]]
code = 350004
domain = "msg"
http_status = 504
message_key = "msg.error.rpc_deadline_exceeded"
severity = "warning"
description = "RPC 预算耗尽（deadline_ms 到期或收到时已耗尽）；结果未知，不得直接重试"

[[errcodes]]
code = 350023
domain = "msg"
http_status = 404
message_key = "msg.error.rpc_method_not_found"
severity = "warning"
description = "RPC 方法未注册（service + method 不在进程内注册表）"

[[errcodes]]
code = 350024
domain = "msg"
http_status = 504
message_key = "msg.error.rpc_stream_idle"
severity = "warning"
description = "RPC 流空闲超时（连续 60s 无帧写出，服务端收尾并释放名额）"


# ---- 业务域声明（第九类记录；域布局统一走装载注册 register_domain_services）----
# 只声明本产品承载的域 `msg`：表的归属域与之同值（`services/table_registry.py`）。
# `deploy/boundaries/domain_layout.json` 是**生成物**（由清单渲染），本仓 ops 渲染命令归 8B_01，
# 本阶段不手写；本地模型发现走服务包清单 `bms_msg.models`，域由表归属 owner 派生。
# 新增业务域（如 01-2 的投递 / 05 的认证）时在此追加声明，勿跨产品复用他域键。
[[domains]]
domain_key = "msg"
name = "消息平台"
service_key = "msg"
status = "placement"
paths = [
  "backend/services/msg/src/bms_msg/models/**/*.py",
  "backend/services/msg/src/bms_msg/repositories/**/*.py",
  "backend/services/msg/src/bms_msg/schemas/**/*.py",
  "backend/services/msg/src/bms_msg/services/**/*.py",
  "backend/services/msg/src/bms_msg/broker/**/*.py",
  "backend/services/msg/src/bms_msg/api/**/*.py",
  "backend/services/msg/src/bms_msg/core/**/*.py",
  "backend/services/msg/src/bms_msg/tenant/**/*.py",
  "backend/services/msg/src/bms_msg/protocol/**/*.py",
  "backend/services/msg/src/bms_msg/rpc/**/*.py",
  "backend/services/msg/src/bms_msg/client/**/*.py",
]
public_api = []
