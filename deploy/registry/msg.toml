# msg 产品自持声明（平台装载 + 装载期校验）
#
# 七段并列：产品档案 / 服务行 / 产品级路由 / 数据源 / 能力 / 种子 / 错误码。
# 口径：基座 `bms_core.registry.products`（同源、同装载入口、同视图族、同唯一性纪律）。
# 校验：`ops.check_modules` 与平台装配期复用同一实现；任一不满足即拒启。
#
# 8B_00 阶段：登记产品档案、服务行与产品路由；数据源 / 能力 / 种子随实现补。
# 8B_01_1 起登记错误码（段位取自本文件服务行 `errcode_segment = "35"`，6 位码 = 2 位段 + 4 位序号）。
# `errcode_segment = "35"` 为暂定值，最终以 07C 标识符登记为准（登记后仅段位调整，码位不变）。

product_key = "msg"

[[products]]
product_key = "msg"
name = "消息平台"
frontend_package_source = "msg#frontend"
status = "enabled"

[[services]]
module_key = "msg"
service_key = "msg"
name = "msg 消息平台服务"
table_prefix = "msg_"
business_code = "msg"
errcode_segment = "35"
event_domain = "msg"
service_group = "product"
build_batch = 3
service_version = "0.1.0"
contract_version = "0.1.0"
tenant_base = true
product_key = "msg"
status = "enabled"

[[product_routes]]
product_key = "msg"
domain = "msg"
service_key = "msg"
description = "msg 消息平台服务（对外 /api/msg/v1/msg/...）"

# ---- 数据源（第五段之前的产品数据源登记）----
# 租户用量只读投影：bms 租户管理页按 `data_source_key` 装载只读板块，
# 前端经网关直取 `path`（对应内部 `/api/v1/msg/tenant-usage`）。
# 口径：配额单一事实源在 msg（`msg_quota`），bms 侧只读、不双写（见架构设计 07 篇第 6 节）。
[[data_sources]]
data_source_key = "msg_tenant_usage"
name = "消息平台用量"
kind = "form"
data_source = "msg.msg.tenant_usage"
origin = "product"
product_key = "msg"
path = "/tenant-usage"
status = "enabled"

# ---- 错误码（第七类记录；段位取自本文件服务行 errcode_segment = "35"）----
# 6 位码 = 2 位段 + 4 位序号；与 `backend/services/msg/src/bms_msg/errors.py` 的 `MsgErrorCode`
# 及异常类 `http_status_` 逐条对齐（对账断言见 `backend/services/msg/tests/test_error_codes.py`）。
# 文案键格式 `<product>.error.<snake>`；判定顺序：租户（350012 / 350011）→ 命名空间（350010）→ 主题。
[[errcodes]]
code = 350010
domain = "msg"
http_status = 400
message_key = "msg.error.namespace_invalid"
severity = "warning"
description = "命名空间未登记或未启用（须为服务目录中已启用的 module_key）"

[[errcodes]]
code = 350011
domain = "msg"
http_status = 403
message_key = "msg.error.tenant_suspended"
severity = "warning"
description = "租户已停用（拒绝生产与消费，数据保留）"

[[errcodes]]
code = 350012
domain = "msg"
http_status = 404
message_key = "msg.error.tenant_not_found"
severity = "warning"
description = "租户不存在（不泄露租户是否存在）"

# ---- 主题与分区（任务 01-1；判定顺序：租户 → 命名空间 → 主题）----
[[errcodes]]
code = 350001
domain = "msg"
http_status = 404
message_key = "msg.error.topic_not_found"
severity = "warning"
description = "主题不存在（或不属于当前租户）"

[[errcodes]]
code = 350008
domain = "msg"
http_status = 409
message_key = "msg.error.topic_exists"
severity = "warning"
description = "主题已存在（同租户 / 命名空间 / 名称）"

[[errcodes]]
code = 350009
domain = "msg"
http_status = 400
message_key = "msg.error.partition_count_invalid"
severity = "warning"
description = "分区数非法（≤0、超上限，或尝试减少）；保留期越界同码"

# ---- 业务域声明（第九类记录；域布局统一走装载注册 register_domain_services）----
# 只声明本产品承载的域 `msg`：表的归属域与之同值（`services/table_registry.py`）。
# `deploy/boundaries/domain_layout.json` 是**生成物**（由清单渲染），本仓 ops 渲染命令归 8B_01，
# 本阶段不手写；本地模型发现走服务包清单 `bms_msg.models`，域由表归属 owner 派生。
# 新增业务域（如 01-2 的投递 / 05 的认证）时在此追加声明，勿跨产品复用他域键。
[[domains]]
domain_key = "msg"
name = "消息平台"
service_key = "msg"
status = "placement"
paths = [
  "backend/services/msg/src/bms_msg/models/**/*.py",
  "backend/services/msg/src/bms_msg/repositories/**/*.py",
  "backend/services/msg/src/bms_msg/schemas/**/*.py",
  "backend/services/msg/src/bms_msg/services/**/*.py",
  "backend/services/msg/src/bms_msg/api/**/*.py",
  "backend/services/msg/src/bms_msg/core/**/*.py",
  "backend/services/msg/src/bms_msg/tenant/**/*.py",
]
public_api = []
