# 演练覆盖层（02-8）
#
# 用途：在本机 / 开发服务器以独立容器名与回环端口跑三实例（原 `ops.cluster_drill` 故障注入已随部署域剥离，本层仅保留编排形态）。
# - 容器名 `msg-drill-1..3`：不与生产 `msg-1..3` 冲突；
# - 仅把业务 8000 绑到 `127.0.0.1:<高位端口>` 供 SSH 隧道访问；内部 8001 仍只在容器网络内；
# - 数据卷宿主目录与演练库前缀由部署态演练环境文件提供（不入库；模板已随部署域剥离）；
# - 库名前缀强制覆盖为演练前缀：`msg.yml` 里写死 `msg`（生产口径），不覆盖会连上开发库；
# - **建表只由首实例做**：三实例并行 `create_all` 会撞 `Table already exists` 崩溃重启；
#   `msg-2/3` 关掉 `auto_create` 并等 `msg-1` 就绪（`/readyz` 只查本机 8001，不等对端，不会互锁）；
# - 不启用 `msg` 网关别名（本层不引用 `msg-cluster.gateway.yml`）。
#
# 用法（开发机）：
#   docker compose -f compose/msg.yml -f compose/msg-drill.override.yml \
#     --env-file drill/cluster.env --profile cluster up -d msg-1 msg-2 msg-3
#
# 端口键与编排同源（`MSG_CLUSTER_DRILL_PORT_N`），改端口只需改一处。

services:
  msg-1:
    container_name: msg-drill-1
    restart: "no"
    ports:
      - "127.0.0.1:${MSG_CLUSTER_DRILL_PORT_1:-18800}:8000"
    environment:
      BMS_REGISTRY__REGISTER_ON_STARTUP: "false"
      BMS_TENANT__DEV_OVERRIDE_TENANT: ${BMS_TENANT__DEV_OVERRIDE_TENANT:-}
      BMS_DATABASE__NAME_PREFIX: ${MSG_CLUSTER_DRILL_DB_PREFIX:-msgdrill}
      BMS_DATABASE__AUTO_CREATE: "true"
  msg-2:
    container_name: msg-drill-2
    restart: "no"
    ports:
      - "127.0.0.1:${MSG_CLUSTER_DRILL_PORT_2:-18801}:8000"
    depends_on:
      msg-1:
        condition: service_healthy
    environment:
      BMS_REGISTRY__REGISTER_ON_STARTUP: "false"
      BMS_TENANT__DEV_OVERRIDE_TENANT: ${BMS_TENANT__DEV_OVERRIDE_TENANT:-}
      BMS_DATABASE__NAME_PREFIX: ${MSG_CLUSTER_DRILL_DB_PREFIX:-msgdrill}
      BMS_DATABASE__AUTO_CREATE: "false"
  msg-3:
    container_name: msg-drill-3
    restart: "no"
    ports:
      - "127.0.0.1:${MSG_CLUSTER_DRILL_PORT_3:-18802}:8000"
    depends_on:
      msg-1:
        condition: service_healthy
    environment:
      BMS_REGISTRY__REGISTER_ON_STARTUP: "false"
      BMS_TENANT__DEV_OVERRIDE_TENANT: ${BMS_TENANT__DEV_OVERRIDE_TENANT:-}
      BMS_DATABASE__NAME_PREFIX: ${MSG_CLUSTER_DRILL_DB_PREFIX:-msgdrill}
      BMS_DATABASE__AUTO_CREATE: "false"

