# msg 产品服务编排（服务名 = 服务标识 `msg`，与平台网关声明式上游 `msg:8000` 对齐）
#
# 拉起（在 msg 仓 `deploy/` 目录，`.env` 提供变量；模板见 `.env.example`）：
#   docker compose -f compose/msg.yml --env-file .env up -d
#
# 口径：
# - 服务名（Compose DNS）取服务标识 `msg`，与平台网关 upstream 节点同口径——对外经产品命名空间
#   `/api/msg/v1/msg/...` 暴露（网关由平台侧产品登记清单 + `PRODUCT_ROUTES` 生成，msg 无需改网关）；
# - **平台基础设施归 bms 部署**（网关 / 认证 / Redis / MySQL / 可观测后端），本编排不重复、不建库；
#   msg 服务经 `.env` 接入平台基础设施与平台网络（见 `networks.platform`）；
# - 仅内部网络（`expose 8000`，**不映射宿主端口**），经平台网关统一入口访问；调试走
#   `docker compose -f compose/msg.yml exec msg <命令>`；
# - 镜像标签必填（`MSG_TAG`，`:?` 语法无 latest 兜底）——由发布流程按版本台账注入；
#   `MSG_REGISTRY_IMAGE_PREFIX` 为「Registry + 项目路径」，镜像全名 = `<前缀>/msg:<标签>`；
# - **三样持久化**：消息日志挂 `/var/lib/msg/data`、位点文件挂 `/var/lib/msg/offsets`（两个独立宿主卷），
#   元数据库随平台库（本编排不挂库目录、容器内无库文件）；
# - **停机**：`stop_grace_period: 45s` 覆盖基座 `[server].graceful_timeout_seconds`（缺省 30s）的
#   在途等待 + drain 协商与「刷日志 → 刷 .delay → 刷位点」收尾；Docker 缺省 10s 会直接 SIGKILL；
# - 健康检查在**镜像层**声明（`/readyz`，与网关摘流同一判据），本编排不重复声明，避免两处参数漂移。
#
# 环境变量（.env，模板见 deploy/.env.example）：密钥与连接串一律经环境变量注入，不入库 / 不入镜像。

x-service-env: &service-env
  BMS_ENV: ${BMS_ENV:-dev}
  # 库名前缀（msg 产品专属；与 config.toml 基线一致，此处显式重申防环境漂移）
  BMS_DATABASE__NAME_PREFIX: msg
  # 运行库（每服务库 × 每租户；URL 模板占位 {service} / {tenant} / {database}，密码经环境变量注入）
  BMS_DATABASE__PLATFORM__URL_TEMPLATE: ${BMS_DATABASE__PLATFORM__URL_TEMPLATE:?}
  BMS_DATABASE__PLATFORM__PASSWORD: ${BMS_DATABASE__PLATFORM__PASSWORD:-}
  BMS_DATABASE__TENANTS__URL_TEMPLATE: ${BMS_DATABASE__TENANTS__URL_TEMPLATE:?}
  BMS_DATABASE__TENANTS__PASSWORD: ${BMS_DATABASE__TENANTS__PASSWORD:-}
  # 归档库（部署态必须显式注入，否则归档链落回配置缺省的本地文件——容器重建即丢）
  BMS_DATABASE__ARCHIVE__URL: ${BMS_DATABASE__ARCHIVE__URL:?}
  BMS_DATABASE__ARCHIVE__PASSWORD: ${BMS_DATABASE__ARCHIVE__PASSWORD:-}
  # 外部依赖端点只经 .env 注入，编排内不写死任何地址 / 账号 / 端口
  BMS_REDIS__URL: ${BMS_REDIS__URL:?}
  BMS_TRACER__OTLP_ENDPOINT: ${BMS_TRACER__OTLP_ENDPOINT:?}
  # 服务间同步调用（http + Compose DNS 基址模板；出站附自签服务 JWT）
  BMS_SERVICE_CLIENT__PROVIDER: http
  BMS_SERVICE_CLIENT__OPTIONS: '{"base_url_template":"http://{service}:8000","attach_service_token":true}'
  # 边缘信任（dev 关旁路强制；prod 开 true）；实现必须是 service_jwt：
  # 网关转发的是服务 JWT + 用户身份头，null 占位会让 msg 把用户请求当成未授权服务身份
  BMS_EDGE__PROVIDER: ${BMS_EDGE__PROVIDER:-service_jwt}
  BMS_EDGE__REQUIRE_GATEWAY_IDENTITY: ${BMS_EDGE__REQUIRE_GATEWAY_IDENTITY:-false}
  # 身份密钥（只经 .env 注入；空值允许装配、使用时 fail-closed）
  BMS_SERVICE_TOKEN__KEYS: ${BMS_SERVICE_TOKEN__KEYS:-}
  BMS_SERVICE_TOKEN__ACTIVE_KID: ${BMS_SERVICE_TOKEN__ACTIVE_KID:-}
  BMS_SECURITY__KEYS: ${BMS_SECURITY__KEYS:-}
  BMS_SECURITY__ACTIVE_KID: ${BMS_SECURITY__ACTIVE_KID:-}
  BMS_SECURITY__SECRET_KEY: ${BMS_SECURITY__SECRET_KEY:-}
  # TLS 证书路径（空值 = 不启用容器内 TLS 终止；两键须同给或同空）
  BMS_SERVER__CERTFILE: ${BMS_SERVER__CERTFILE:-}
  BMS_SERVER__KEYFILE: ${BMS_SERVER__KEYFILE:-}
  # 存储水位旋钮（空值沿用代码缺省；未经本锚点列出的 .env 键不进容器）
  MSG_STORAGE_WARN_RATIO: ${MSG_STORAGE_WARN_RATIO:-}
  MSG_STORAGE_REJECT_RATIO: ${MSG_STORAGE_REJECT_RATIO:-}
  MSG_STORAGE_SAMPLE_TTL_MS: ${MSG_STORAGE_SAMPLE_TTL_MS:-}
  # 复制运行旋钮（02-4；空值沿用代码缺省，缺省关闭复制；未经本锚点列出的 .env 键不进容器）
  MSG_REPLICATION_ENABLED: ${MSG_REPLICATION_ENABLED:-}
  MSG_REPLICATION_NODE_ID: ${MSG_REPLICATION_NODE_ID:-}
  MSG_REPLICATION_NODES: ${MSG_REPLICATION_NODES:-}
  MSG_REPLICATION_FACTOR: ${MSG_REPLICATION_FACTOR:-}
  MSG_REPLICATION_MIN_INSYNC: ${MSG_REPLICATION_MIN_INSYNC:-}
  MSG_REPLICATION_LAG_TIME_MS: ${MSG_REPLICATION_LAG_TIME_MS:-}
  MSG_REPLICATION_LAG_RECORDS: ${MSG_REPLICATION_LAG_RECORDS:-}
  MSG_REPLICATION_FETCH_INTERVAL_MS: ${MSG_REPLICATION_FETCH_INTERVAL_MS:-}
  MSG_REPLICATION_FETCH_BATCH: ${MSG_REPLICATION_FETCH_BATCH:-}
  MSG_REPLICATION_COMMIT_TIMEOUT_MS: ${MSG_REPLICATION_COMMIT_TIMEOUT_MS:-}
  MSG_REPLICATION_SCAN_INTERVAL_MS: ${MSG_REPLICATION_SCAN_INTERVAL_MS:-}
  MSG_REPLICATION_TOPOLOGY_TTL_MS: ${MSG_REPLICATION_TOPOLOGY_TTL_MS:-}
  # 02-5 切主：epoch 刷新 / 写租约 / 停写宽限（宽限须 ≥ 租约）
  MSG_REPLICATION_EPOCH_REFRESH_MS: ${MSG_REPLICATION_EPOCH_REFRESH_MS:-}
  MSG_REPLICATION_LEADER_LEASE_MS: ${MSG_REPLICATION_LEADER_LEASE_MS:-}
  MSG_REPLICATION_SWITCH_GRACE_MS: ${MSG_REPLICATION_SWITCH_GRACE_MS:-}
  # 02-9 自动选举（缺省关闭；cluster profile 与演练环境显式开启）
  MSG_AUTO_ELECTION_ENABLED: ${MSG_AUTO_ELECTION_ENABLED:-}
  MSG_AUTO_ELECTION_DETECT_INTERVAL_MS: ${MSG_AUTO_ELECTION_DETECT_INTERVAL_MS:-}
  MSG_AUTO_ELECTION_PROBE_TIMEOUT_MS: ${MSG_AUTO_ELECTION_PROBE_TIMEOUT_MS:-}
  MSG_AUTO_ELECTION_FAILURE_THRESHOLD: ${MSG_AUTO_ELECTION_FAILURE_THRESHOLD:-}
  MSG_AUTO_ELECTION_MAX_ATTEMPTS: ${MSG_AUTO_ELECTION_MAX_ATTEMPTS:-}
  MSG_AUTO_ELECTION_BACKOFF_BASE_MS: ${MSG_AUTO_ELECTION_BACKOFF_BASE_MS:-}
  MSG_AUTO_ELECTION_BACKOFF_CAP_MS: ${MSG_AUTO_ELECTION_BACKOFF_CAP_MS:-}
  MSG_AUTO_ELECTION_COOLDOWN_MS: ${MSG_AUTO_ELECTION_COOLDOWN_MS:-}
  MSG_AUTO_ELECTION_CONCURRENCY: ${MSG_AUTO_ELECTION_CONCURRENCY:-}
  MSG_AUTO_ELECTION_STAGGER_MS: ${MSG_AUTO_ELECTION_STAGGER_MS:-}
  # 02-8 内部复制通道（单实例保持空值 = 不监听 8001；cluster profile 覆盖为 8001）
  MSG_REPLICATION_INTERNAL_PORT: ${MSG_REPLICATION_INTERNAL_PORT:-}
  MSG_REPLICATION_INTERNAL_HOST: ${MSG_REPLICATION_INTERNAL_HOST:-}
  MSG_REPLICATION_NODE_ENDPOINTS: ${MSG_REPLICATION_NODE_ENDPOINTS:-}
  MSG_REPLICATION_INTERNAL_TIMEOUT_MS: ${MSG_REPLICATION_INTERNAL_TIMEOUT_MS:-}
  MSG_REPLICATION_INTERNAL_CONNECT_TIMEOUT_MS: ${MSG_REPLICATION_INTERNAL_CONNECT_TIMEOUT_MS:-}
  MSG_REPLICATION_FETCH_MAX_BYTES: ${MSG_REPLICATION_FETCH_MAX_BYTES:-}
  # 消息数据根：`data/` 与 `offsets/` 两个子目录各挂一卷（容器内路径固定，不随环境改）
  MSG_DATA_DIR: /var/lib/msg
  # 启动期声明上报（注册表是权威来源）：部署态保持 true——上报被拒即拒启，不静默降级；
  # 仅离线冒烟（平台未参与）时经 .env 置 false，声明装载校验归任务 07-1-2。
  BMS_REGISTRY__REGISTER_ON_STARTUP: ${BMS_REGISTRY__REGISTER_ON_STARTUP:-true}

x-cluster-env: &cluster-env
  # 三实例共用口径：节点标识与内部地址一一对应（Compose DNS 即内部 DNS）
  MSG_REPLICATION_ENABLED: "true"
  MSG_REPLICATION_NODES: msg-1,msg-2,msg-3
  MSG_REPLICATION_FACTOR: "3"
  MSG_REPLICATION_MIN_INSYNC: "2"
  MSG_REPLICATION_INTERNAL_PORT: "8001"
  MSG_REPLICATION_NODE_ENDPOINTS: msg-1=http://msg-1:8001,msg-2=http://msg-2:8001,msg-3=http://msg-3:8001
  # 三实例不重复登记产品声明（登记由 07-8 决定；演练 / 集群默认关闭）
  BMS_REGISTRY__REGISTER_ON_STARTUP: "false"

services:
  msg:
    image: ${MSG_REGISTRY_IMAGE_PREFIX:?MSG_REGISTRY_IMAGE_PREFIX required}/msg:${MSG_TAG:?MSG_TAG required}
    container_name: msg
    restart: unless-stopped
    # 在途请求按 GOAWAY / drain 收尾后再退出（见文件头「停机」）
    stop_grace_period: 45s
    expose:
      - "8000"
    volumes:
      # 消息日志（独立卷，不与系统盘 / 容器可写层混放）
      - ${MSG_DATA_HOST_DIR:?MSG_DATA_HOST_DIR required}:/var/lib/msg/data
      # 位点文件（与 data/ 平级；备份口径不同，故各挂一卷）
      - ${MSG_OFFSETS_HOST_DIR:?MSG_OFFSETS_HOST_DIR required}:/var/lib/msg/offsets
    environment:
      <<: *service-env
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # 三实例（02-8）：显式服务而非 --scale——Compose 缩放副本没有稳定 DNS 名，
  # 无法把 node_id 与内部地址一一对应。`msg` 保持默认单实例，三实例用 profile 隔离。
  # 拉起：docker compose -f compose/msg.yml --profile cluster up -d msg-1 msg-2 msg-3
  # ---------------------------------------------------------------------------
  msg-1:
    profiles: ["cluster"]
    image: ${MSG_REGISTRY_IMAGE_PREFIX:?MSG_REGISTRY_IMAGE_PREFIX required}/msg:${MSG_TAG:?MSG_TAG required}
    container_name: msg-1
    restart: unless-stopped
    stop_grace_period: 45s
    expose:
      - "8000"
      - "8001"
    volumes:
      - ${MSG_DATA_HOST_DIR_1:?MSG_DATA_HOST_DIR_1 required}:/var/lib/msg/data
      - ${MSG_OFFSETS_HOST_DIR_1:?MSG_OFFSETS_HOST_DIR_1 required}:/var/lib/msg/offsets
    environment:
      <<: [*cluster-env, *service-env]
      MSG_REPLICATION_NODE_ID: msg-1
    networks:
      - platform

  msg-2:
    profiles: ["cluster"]
    image: ${MSG_REGISTRY_IMAGE_PREFIX:?MSG_REGISTRY_IMAGE_PREFIX required}/msg:${MSG_TAG:?MSG_TAG required}
    container_name: msg-2
    restart: unless-stopped
    stop_grace_period: 45s
    expose:
      - "8000"
      - "8001"
    volumes:
      - ${MSG_DATA_HOST_DIR_2:?MSG_DATA_HOST_DIR_2 required}:/var/lib/msg/data
      - ${MSG_OFFSETS_HOST_DIR_2:?MSG_OFFSETS_HOST_DIR_2 required}:/var/lib/msg/offsets
    environment:
      <<: [*cluster-env, *service-env]
      MSG_REPLICATION_NODE_ID: msg-2
    networks:
      - platform

  msg-3:
    profiles: ["cluster"]
    image: ${MSG_REGISTRY_IMAGE_PREFIX:?MSG_REGISTRY_IMAGE_PREFIX required}/msg:${MSG_TAG:?MSG_TAG required}
    container_name: msg-3
    restart: unless-stopped
    stop_grace_period: 45s
    expose:
      - "8000"
      - "8001"
    volumes:
      - ${MSG_DATA_HOST_DIR_3:?MSG_DATA_HOST_DIR_3 required}:/var/lib/msg/data
      - ${MSG_OFFSETS_HOST_DIR_3:?MSG_OFFSETS_HOST_DIR_3 required}:/var/lib/msg/offsets
    environment:
      <<: [*cluster-env, *service-env]
      MSG_REPLICATION_NODE_ID: msg-3
    networks:
      - platform

networks:
  # 平台网络（bms 部署创建）：使平台网关可解析 `msg:8000`，本服务亦可达平台服务。
  # 实际网络名以平台部署为准，经 .env 的 PLATFORM_NETWORK 覆盖（缺省值只作本地参照）。
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-deploy_default}
