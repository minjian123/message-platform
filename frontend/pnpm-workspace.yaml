# 平台基座包不纳入本工作区成员：改由模块以 `link:` 引用工作区 bms 克隆。
# 纳入成员会让本工作区每次安装都重建 bms 包的 node_modules 并链接到本仓 store，
# 反向污染 bms 的构建（两份 Vue 类型）。构建前提：bms 依赖已安装（bms 仓根 重装依赖 / 还原依赖）。
packages:
  - 'modules/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - vue-demi
# 传递依赖钉版（2026-11-14）：rolldown 由 vite 8 引入，msg 锁文件曾解析到 1.2.16、mdm 为 1.2.12；
# Linux CI 上 1.2.16 对 MF 共享包装的 named-export 链接报 MISSING_EXPORT。与 mdm 已验证组合对齐。
overrides:
  rolldown: 1.2.12
