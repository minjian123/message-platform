# msg 仓工程化工具包配置（唯一：文档根 / 工程清单 / 选测规则 / 预检步骤 / 拦截口径）
# 口径见 engkit 文档《工程化工具包说明》§4 字段表。
#
# 8B_00 设计阶段：ops / 契约 / 域布局等门禁步骤在实现阶段启用（当前以注释保留），
# 避免空仓预检因缺少 ops 包而误红。

[repo]
name = "msg"

[docs]
root = "msg文档"

[docs.scope]
whitelist_dirs = ["规范/", "资料/", "用户文档/"]
plan_dir_pattern = "^项目/[^/]+/计划/"

[backend]
root = "backend"
groups = ["services"]
test_prefix = "test_"
projects = ["services/msg"]
coverage_packages = ["bms_msg", "services", "ops"]

[selection]
# 开发环依赖深度：direct = 只认直接 import；推送前预检固定用 closure
depth = "direct"
ruff_cmd = "uv run --project backend ruff"
ruff_config = "backend/pyproject.toml"

[pytest]
cmd = "uv run pytest"
cwd = "backend"

[coverage]
data_env = "MSG_COVERAGE_DATA"
source_env = "MSG_COVERAGE_SOURCE"
# 门禁阈值：行 + 分支 100%，与其他仓统一、不设例外（口径见 bms《AI开发规范》「覆盖率要求」节）
fail_under = 100
plugin = "engkit.coverage_plugin"
data_file = ".cache/coverage/.coverage"
interpreter = "uv run python"

# ---- 场景闸门：预检是推送的内部步骤（`engkit push`），本地不设独立入口 ----
[preflight.gate]
dirty_tree = true
audit_file = ".cache/preflight/audit.jsonl"

# ---- 推送入口（`engkit push`）：预检通过后自动推送 ----
[push]
remote = "origin"
branch = "main"
doc_globs = ["*.md", "*.txt", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg", "*.webp", "*.pdf"]

# ---- 预检步骤（声明序即执行序；`--fast` 只跑 always，`--full` 追加 full + scoped）----
[[preflight.steps]]
label = "行尾：工作树 CRLF 检查（应为 LF 的文件不得残留 CRLF）"
# 用 `{python} -m engkit`：本仓无 `uv.lock`，`uv run engkit` 在新解析出的 venv 里没有该 console script
cmd = ["{python}", "-m", "engkit", "eol", "--quiet"]

[[preflight.steps]]
label = "门禁冒烟：Python 版本"
cmd = ["{python}", "-c", "import sys; assert sys.version_info >= (3, 14), 'Python < 3.14'"]

[[preflight.steps]]
label = "后端静态：ruff check"
cmd = ["uv", "run", "ruff", "check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：ruff format --check"
cmd = ["uv", "run", "ruff", "format", "--check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：pyright"
cmd = ["uv", "run", "pyright"]
cwd = "backend"

# ---- 契约：公开契约零漂移（03-1 起；改动端点后必须 `python -m ops.contract_snapshot export`）----
# 用 `{python}` 而非 `uv run`：本仓无 `uv.lock` 与仓内 `.venv`，`uv run` 会在预检里临时解析依赖。
[[preflight.steps]]
label = "契约：contract_snapshot check（公开契约零漂移）"
cmd = ["{python}", "-m", "ops.contract_snapshot", "check"]
cwd = "backend"

# ---- 前端类型：契约快照 → TypeScript 生成物零漂移（06-1-3）----
[[preflight.steps]]
label = "前端类型：api-types --check（契约零漂移）"
cmd = ["node", "packages/api-types/scripts/generate.mjs", "--check"]
cwd = "frontend"

# ---- 实现阶段启用（8B_01 起）----
# [[preflight.steps]]
# label = "门禁：check_modules（模块清单零漂移）"
# cmd = ["uv", "run", "python", "-m", "ops.check_modules"]
# cwd = "backend"
#
# [[preflight.steps]]
# label = "契约：event_contracts check（事件契约零漂移 + 兼容）"
# cmd = ["uv", "run", "python", "-m", "ops.event_contracts", "check"]
# cwd = "backend"

[[preflight.steps]]
label = "基座：check_backend_base（继承链 / 清单 / 直继承 / 形态 / 错误码段位 / 迁移链）"
cmd = ["{python}", "-m", "engkit", "base", "backend-base"]

[[preflight.steps]]
label = "基座：check_frontend_base（前端继承链 / 清单 / 体系根）"
cmd = ["{python}", "-m", "engkit", "base", "frontend-base"]

[[preflight.steps]]
label = "文档：engkit links（链接与锚点）"
cmd = ["{python}", "-m", "engkit", "links"]

[[preflight.steps]]
label = "文档：engkit docs-scope（进度类字段落点）"
cmd = ["{python}", "-m", "engkit", "docs-scope"]

[[preflight.steps]]
label = "基座：check_bare_collections（裸无序集合护栏）"
cmd = ["{python}", "-m", "engkit", "base", "bare-collections"]

[[preflight.steps]]
label = "基座：check_snowflake_ids（裸 BigInteger 雪花 ID 列 / schema 残留）"
cmd = ["{python}", "-m", "engkit", "base", "snowflake-ids"]

[[preflight.steps]]
label = "后端测试：定向（选测 + 覆盖率门禁 + 扩圈）"
type = "scoped_tests"
preset = "scoped"

[[preflight.steps]]
label = "后端测试：聚合全量（--full；仅 CI；含行 + 分支 100% 覆盖率门禁）"
type = "full_tests"
preset = "full"

[guard]
scripts = []
repo_dirs = ["services", "ops", "alembic"]
dir_test_threshold = 20
full_test_dirs = []

# ---- 基座校验器规则 ----
[rules.test_db_isolation]
scan_targets = ["backend/services", "backend/tests", "backend/tests_support"]
allow_marker = "own_db"
db_literal_prefixes = ["sqlite+aiosqlite:///", "sqlite:///"]
engine_factories = ["create_async_engine", "create_engine"]
db_file_suffixes = [".db"]
id_columns = ["id"]
cleanup_calls = ["drop_all"]
exclude_parts = ["__pycache__", ".venv", "node_modules", ".git"]

[rules.env_example]
private_key_marker = "PRIVATE KEY"
placeholder_marker = "..."

[[rules.env_example.templates]]
path = "deploy/.env.example"
required_keys = [
  "PLATFORM_NETWORK",
  "MSG_REGISTRY_IMAGE_PREFIX",
  "MSG_TAG",
  "BMS_DATABASE__PLATFORM__URL_TEMPLATE",
  "BMS_REDIS__URL",
  "BMS_SERVICE_TOKEN__KEYS",
]

[rules.docs_status]
project_dir = "msg文档/项目"
stage = "08B_消息平台"
statuses = ["未开始", "进行中", "部分完成", "已完成", "搁置"]
todo_statuses = ["未开始", "进行中", "部分完成", "搁置"]
done_status = "已完成"
req_id_pattern = '^\d{2}-\d+$'
task_id_pattern = '^\d{2}-\d+-\d+$'
plan_id_pattern = '^\d{2}_\d{2}$'

[rules.backend_base]
# 产品仓形态：清单 / 契约自持（只登记本仓继承类与链），父类经 bms 的基座源码面解析，
# 链必须接到平台体系根；错误码按产品码（6 位，段位取自服务行 errcode_segment）判定。
profile = "product"
manifest = "msg文档/后端基类清单.md"
chain_doc = "msg文档/设计/基类体系/后端基类实现契约.md"
source_dirs = ["backend/services/msg/src"]
base_source_dirs = ["../bms/backend/libs/bms_core/src"]
error_codes = "backend/services/msg/src/bms_msg/errors.py"
versions_dir = "backend/alembic/versions"
direct_baseline = "deploy/boundaries/direct_base_object_baseline.json"
root_bases_marker = "体系根清单"
value_object_root = "BaseValueObject"
framework_object_root = "BaseFrameworkObject"
datasources = ["platform", "tenant"]
default_chain = "platform:tenant"
error_code_segment = "35"

[rules.frontend_base]
# 产品仓形态：前端清单 / 契约自持，父类经 bms 基座前端源码面解析，链须接到平台体系根。
profile = "product"
manifest = "msg文档/前端基类清单.md"
chain_doc = "msg文档/设计/基类体系/前端基类实现契约.md"
source_dirs = ["frontend/modules/msg/src"]
base_source_dirs = ["../bms/frontend/packages/core/src"]
root_bases_marker = "体系根清单"

# ---- 基座护栏：裸无序集合（07D 收口接入；形态定义与 bms 同源，扫描根本仓自持）----
[rules.bare_collections]
scan_targets = ["backend/services/msg/src"]
exclude_parts = ["__pycache__", ".venv", "node_modules", ".git"]
whitelist = [
  "ConcurrentStableList",
  "ConcurrentStableSet",
  "ConcurrentStableDict",
  "ConcurrentStableFrozenList",
  "ConcurrentStableFrozenSet",
  "ConcurrentStableFrozenDict",
]
unregistered = [
  "deque",
  "Deque",
  "Counter",
  "OrderedDict",
  "ChainMap",
  "defaultdict",
  "UserDict",
  "UserList",
  "UserString",
  "KeysView",
  "ItemsView",
  "ValuesView",
  "MappingView",
]
tuple_forms = ["tuple", "Tuple"]
protocol_forms = [
  "Iterable",
  "Iterator",
  "Generator",
  "AsyncIterator",
  "AsyncIterable",
  "AsyncGenerator",
  "Callable",
  "Awaitable",
  "Coroutine",
  "Reversible",
  "Container",
  "Sized",
  "Hashable",
]
# 本仓无集合体系实现文件（实现全在平台 bms_core），故为空
implementation_files = []
allow_marker = "# bare-collections:allow"
baseline = "deploy/boundaries/bare_collections_baseline.json"

[rules.bare_collections.banned]
bare = ["dict", "list", "set", "frozenset", "Dict", "List", "Set", "FrozenSet", "DefaultDict"]
readonly = [
  "Sequence",
  "Mapping",
  "AbstractSet",
  "Collection",
  "MutableSequence",
  "MutableMapping",
  "MutableSet",
]
ascending = [
  "SortedList",
  "SortedDict",
  "SortedSet",
  "ConcurrentSortedList",
  "ConcurrentSortedSet",
  "ConcurrentSortedDict",
]

[rules.bare_collections.reasons]
tuple = "同构 tuple 视为集合声明，请落 ConcurrentStableList（值对象字段落 ConcurrentStableFrozenList）"
bare_tuple = "裸 tuple 无元素类型信息，请写明元素类型后按同构 / 固定元数判定"
banned = "集合声明须命中白名单（插入序 ConcurrentStable* / 不可变 ConcurrentStableFrozen*）"
unregistered = "未登记的集合形态：请先登记护栏白名单与《后端基类清单》，或改用插入序集合类"

# ---- 基座护栏：雪花 ID（口径同 bms：ID 列一律 SnowflakeId，BigInteger 仅计数 / 度量）----
[rules.snowflake_ids]
scan_targets = ["backend/services/msg/src"]
id_names = ["id", "tenant_scope", "rolled_back_from"]
id_suffixes = ["_id", "_by"]
# 本仓暂无计数 / 度量列的 BigInteger 例外；新增须逐条写明用途
whitelist = []
